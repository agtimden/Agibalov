<!-- Объявление типа документа как HTML5 -->
<!DOCTYPE html>
<!-- Начало HTML документа с указанием русского языка -->
<html lang="ru">
<!-- Секция head содержит метаданные и подключаемые ресурсы -->
<head>
    <!-- Указание кодировки UTF-8 для корректного отображения символов -->
    <meta charset="UTF-8">
    <!-- Настройка viewport для адаптивного дизайна -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Заголовок страницы -->
    <title>aСобрать ланч | Меню компании</title>
    <!-- Подключение шрифтов Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Подключение CSS файлов -->
    <link rel="stylesheet" href="style-glavnoy.css">
    <link rel="stylesheet" href="styles-lunch.css">
</head>
<!-- Тело документа -->
<body>
    <!-- Шапка сайта -->
    <header>
        <!-- Главный заголовок страницы -->
        <h1>Собрать ланч</h1>
        <!-- Навигационное меню -->
        <nav>
            <!-- Ссылки навигации -->
            <a href="glavnaya.html">Главная</a>
            <a href="#about">О компании</a>
            <a href="#advantages">Преимущества</a>
            <a href="#menu">Меню</a>
            <a href="#contacts">Контакты</a>
            <!-- Активная ссылка текущей страницы -->
            <a href="sobrat-lunch.html" id="active">Собрать ланч</a>
        </nav>
    </header>
    <!-- Основной контент -->
    <main>
        <!-- Секция с супами -->
        <section id="soups">
            <!-- Заголовок секции -->
            <h2>Супы</h2>
            <!-- Контейнер для фильтров -->
            <div class="filters">
                <!-- Кнопки фильтрации по типам супов -->
                <button type="button" class="filter-btn" data-kind="fish">рыбный</button>
                <button type="button" class="filter-btn" data-kind="meat">мясной</button>
                <button type="button" class="filter-btn" data-kind="vegetarian">вегетарианский</button>
            </div>
            <!-- Контейнер для карточек блюд -->
            <div class="menu-items"></div>
        </section>
        
        <!-- Секция с главными блюдами -->
        <section id="main-dishes">
            <!-- Заголовок секции -->
            <h2>Главные блюда</h2>
            <!-- Контейнер для фильтров -->
            <div class="filters">
                <!-- Кнопки фильтрации по типам главных блюд -->
                <button type="button" class="filter-btn" data-kind="fish">рыбное</button>
                <button type="button" class="filter-btn" data-kind="meat">мясное</button>
                <button type="button" class="filter-btn" data-kind="vegetarian">вегетарианское</button>
            </div>
            <!-- Контейнер для карточек блюд -->
            <div class="menu-items"></div>
        </section>
    </main>
    <!-- Секция формы заказа -->
    <section id="order-form-section">
        <!-- Заголовок формы -->
        <h2>Оформить заказ</h2>
        <!-- Форма заказа с отправкой на тестовый сервер -->
        <form action="https://httpbin.org/post" method="post" novalidate>
            <!-- Филдсет для выбора блюд -->
            <fieldset>
                <!-- Легенда филдсета -->
                <legend>Ваш заказ</legend>
                <!-- Выпадающий список для выбора супа -->
                <label for="soup">Суп:</label>
                <select name="soup" id="soup" required>
                    <option value="">Выберите суп</option>
                </select><br>
            </fieldset>
            <!-- Филдсет для данных клиента -->
            <fieldset>
                <!-- Легенда филдсета -->
                <legend>Данные клиента</legend>
                <!-- Поле ввода имени -->
                <label for="name">Имя:</label>
                <input type="text" id="name" name="name" required><br>
            </fieldset>
            <!-- Кнопки управления формой -->
            <button type="reset">Сбросить</button>
            <button type="submit">Отправить</button>
        </form>
    </section>
    <!-- Подвал сайта -->
    <footer>
        <!-- Контактная информация -->
        <p>Контактные данные:</p>
        <p>Телефон: <a href="tel:+74951234567">+7 (495) 123-45-67</a></p>
        <p>Email: <a href="mailto:info@businesslunch.ru">info@businesslunch.ru</a></p>
        <p>Адрес: г. Москва, ул. Примерная, д. 1</p>
    </footer>
    <!-- Подключение JavaScript файлов -->
    <script src="api.js"></script>
    <script src="order-validation.js"></script>
    <script src="form-validation.js"></script>
</body>
</html>
